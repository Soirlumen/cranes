version: '3.8'
services:
  db:
    image: postgres:latest
    container_name: moje_stavebni_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tajneheslo
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
